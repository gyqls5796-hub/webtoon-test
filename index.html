<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>할아버지의 오래된 기침 (1탄) - 결핵 예방 및 관리 웹툰</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-dark: #111827;
      --text-gray: #4b5563;
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --accent: #dc2626;
      --green: #059669;
      --orange: #d97706;
      --font-scale: 1.25; /* 기본: 어르신 맞춤 크게 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Nanum Gothic', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      line-height: 1.65;
      word-break: keep-all;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 상단 고정 바 */
    .header-bar {
      position: fixed; top: 0; left: 0; right: 0;
      background: #ffffff; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      z-index: 1000; border-bottom: 3px solid var(--primary);
    }
    .header-inner {
      max-width: 640px; margin: 0 auto; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .title-wrap h1 { font-size: calc(16px * var(--font-scale)); font-weight: 800; color: var(--primary-dark); }
    .title-wrap p { font-size: calc(12px * var(--font-scale)); color: var(--accent); font-weight: 800; }

    /* 글자 크기 조절 버튼 */
    .font-controls { display: flex; align-items: center; gap: 6px; background: #eff6ff; padding: 4px 8px; border-radius: 12px; border: 2px solid #bfdbfe; }
    .font-btn {
      min-width: 48px; min-height: 44px; background: #ffffff; border: 2px solid var(--primary);
      color: var(--primary-dark); font-size: 17px; font-weight: 800; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .font-badge { font-size: 14px; font-weight: 800; color: var(--primary-dark); min-width: 48px; text-align: center; }

    /* 본문 컨테이너 (전체 스크롤, 내부 스크롤 없음) */
    .container {
      width: 100%; max-width: 640px;
      padding: 110px 12px 120px 12px;
      display: flex; flex-direction: column; gap: 28px;
    }
    .section-banner {
      background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #ffffff;
      padding: 14px 18px; border-radius: 14px; font-size: calc(16px * var(--font-scale)); font-weight: 800; text-align: center;
    }

    /* 웹툰 컷 카드 */
    .toon-card {
      background: var(--card-bg); border-radius: 18px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      border: 2px solid #cbd5e1; overflow: hidden; display: flex; flex-direction: column;
    }
    .card-header {
      background: #f8fafc; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #e2e8f0;
    }
    .cut-badge { background: var(--primary); color: #ffffff; font-size: calc(13px * var(--font-scale)); font-weight: 800; padding: 4px 12px; border-radius: 20px; }
    .tts-btn { background: #eff6ff; border: 1.5px solid #3b82f6; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 800; color: #1d4ed8; cursor: pointer; }

    /* 이미지 박스 (4:3 비율 고정) */
    .image-box { width: 100%; aspect-ratio: 4 / 3; background: #e2e8f0; position: relative; border-bottom: 2px solid #1e293b; }
    .image-box img { width: 100%; height: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }

    /* 대사 및 설명 영역 */
    .content-box { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .scene-desc { font-size: calc(14px * var(--font-scale)); color: var(--text-gray); font-weight: 700; background: #f1f5f9; padding: 10px 14px; border-radius: 10px; }
    .speech-bubble {
      background: #fffbeb; border: 2.5px solid #f59e0b; border-radius: 16px; padding: 14px 16px;
      font-size: calc(16px * var(--font-scale)); font-weight: 800; color: var(--text-dark);
    }
    .speaker-name { display: inline-block; background: #d97706; color: #ffffff; font-size: calc(13px * var(--font-scale)); padding: 2px 10px; border-radius: 8px; margin-bottom: 6px; }
    .speaker-nurse .speaker-name { background: var(--green); }
    .speaker-nurse { background: #ecfdf5; border-color: #10b981; }
    .speaker-haeun .speaker-name { background: var(--primary); }
    .speaker-haeun { background: #eff6ff; border-color: #60a5fa; }
    .key-message { background: #fef2f2; border-left: 6px solid var(--accent); padding: 12px 14px; border-radius: 8px; font-size: calc(15px * var(--font-scale)); font-weight: 800; color: #991b1b; }

    /* 요약 카드 */
    .summary-card { border: 4px solid var(--orange); background: #fffbeb; }
    .summary-list { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
    .summary-item { background: #ffffff; border: 2px solid #fcd34d; padding: 14px; border-radius: 12px; font-size: calc(16px * var(--font-scale)); font-weight: 800; color: #111827; }

    /* 하단 고정 바 */
    .footer-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #ffffff; box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.12);
      z-index: 1000; border-top: 3px solid var(--primary);
    }
    .footer-inner { max-width: 640px; margin: 0 auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
    .footer-slogan { text-align: center; font-size: calc(13px * var(--font-scale)); font-weight: 800; color: var(--accent); }
    .nav-btns { display: flex; gap: 8px; }
    .nav-btn {
      flex: 1; min-height: 48px; border: none; border-radius: 12px;
      font-size: calc(14px * var(--font-scale)); font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; text-decoration: none;
    }
    .nav-btn.prev { background: #e2e8f0; color: #1e293b; }
    .nav-btn.tts-all { background: #dbeafe; color: #1e40af; }
    .nav-btn.call { background: var(--green); color: #ffffff; flex: 1.3; }
  </style>
</head>
<body>

  <!-- 상단 고정 메뉴 -->
  <header class="header-bar" id="headerBar">
    <div class="header-inner">
      <div class="title-wrap">
        <h1>할아버지의 오래된 기침 (1탄)</h1>
        <p>기침 2주 넘으면 ➔ 보건소 무료 검진!</p>
      </div>
      <div class="font-controls">
        <button class="font-btn" onclick="changeFontSize(-1)">가 -</button>
        <span class="font-badge" id="fontBadge">크게</span>
        <button class="font-btn" onclick="changeFontSize(1)">가 +</button>
      </div>
    </div>
  </header>

  <!-- 웹툰 본문 (22컷 자동 렌더링) -->
  <main class="container" id="mainContainer"></main>

  <!-- 하단 고정 메뉴 -->
  <footer class="footer-bar" id="footerBar">
    <div class="footer-inner">
      <div class="footer-slogan">📢 "기침 2주 넘으면 감기가 아닐 수 있습니다 → 보건소로 오이소!"</div>
      <div class="nav-btns">
        <button class="nav-btn prev" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆ 맨 위로</button>
        <button class="nav-btn tts-all" onclick="readCurrentVisibleCut()">🔊 읽어주기</button>
        <a class="nav-btn call" href="https://m.search.naver.com/search.naver?query=가까운+보건소" target="_blank">🏥 보건소 찾기</a>
      </div>
    </div>
  </footer>

  <script>
    // 22컷 전체 데이터 및 고화질 웹툰 이미지 매핑
    const WEBTOON_CUTS = [
      { cut: 1, section: "프롤로그: 수상한 기침 (1~6컷)", scene: "마을회관. 박말순 할아버지(75세)가 장기판 앞에서 마른기침을 콜록콜록 합니다.", img: "[cite: 1]", dialogues: [{ speaker: "마을회관 친구", role: "friend", text: "말순이 형님, 기침이 와 그리 오래가노?" }, { speaker: "박말순 할아버지", role: "grandpa", text: "환절기 감기 아이가. 약국 약 먹으모 낫는다." }], tip: "기침이 2주 넘게 계속되면 단순 감기가 아닐 수 있습니다." },
      { cut: 2, scene: "약국 감기약을 털어 먹는 할아버지. 벽걸이 달력에 '기침 시작' 표시가 벌써 3주째입니다.", img: "[cite: 6]", dialogues: [{ speaker: "박말순 할아버지", role: "grandpa", text: "이상하네... 약을 이래 무도 기침이 안 떨어지노." }], tip: "핵심 기억! 기침이 2주 이상 이어지면 꼭 보건소로 가세요." },
      { cut: 3, scene: "깊은 밤. 잠자리에서 식은땀으로 이불이 흠뻑 젖어 있고, 할머니가 걱정스레 바라봅니다.", img: "[cite: 7]", dialogues: [{ speaker: "할머니", role: "grandma", text: "영감, 자면서 식은땀을 와 이래 많이 흘리노... 이불이 다 젖었네." }], tip: "밤에 자면서 식은땀이 많이 나는 것도 결핵의 주요 증상입니다." },
      { cut: 4, scene: "아침 밥상. 입맛이 없어 숟가락을 힘없이 내려놓는 할아버지.", img: "[cite: 8]", dialogues: [{ speaker: "할머니", role: "grandma", text: "영감, 요새 와 이래 밥을 못 묵노? 바지도 헐렁하네." }, { speaker: "박말순 할아버지", role: "grandpa", text: "나이 들모 다 그렇지 뭐..." }], tip: "나이 탓이라고 넘기지 마세요! 체중 감소와 피로감은 몸이 보내는 신호입니다." },
      { cut: 5, scene: "[중요 정보 컷] 할아버지 몸에 나타난 결핵 의심 증상 5가지!", img: "[cite: 9]", dialogues: [{ speaker: "꼭 확인하세요!", role: "nurse", text: "① 2주 넘는 기침  ② 가래  ③ 미열  ④ 밤에 식은땀  ⑤ 몸무게 줄고 기운 없음" }], tip: "기침 2주 ➔ 지체 없이 보건소!" },
      { cut: 6, scene: "주말에 놀러 온 대학생 손녀 하은이가 기침하며 야위어 가는 할아버지를 유심히 보며 표정이 굳습니다.", img: "[cite: 10]", dialogues: [{ speaker: "손녀 하은", role: "haeun", text: "(할아버지 기침 소리가 예사롭지 않은데... 살도 너무 빠지셨어!)" }], tip: "가족들이 어르신의 기침 기간을 함께 살펴봐 주세요." },
      
      { cut: 7, section: "대처: 보건소 무료 검진 (7~12컷)", scene: "손녀 하은이가 할아버지의 거친 두 손을 꼭 잡으며 진지하게 말씀드립니다.", img: "[cite: 11]", dialogues: [{ speaker: "손녀 하은", role: "haeun", text: "할아버지, 기침 2주 넘으면 보건소 가야 돼요. 감기가 아닐 수도 있어요!" }, { speaker: "박말순 할아버지", role: "grandpa", text: "내가 와 결핵이고, 그거 못 먹던 옛날 병 아이가…" }], tip: "결핵은 옛날 병이 아닙니다. 지금도 우리 주변에 흔히 있습니다." },
      { cut: 8, scene: "[인식 개선] 하은이가 스마트폰의 큼직한 뉴스 통계를 할아버지께 보여드립니다.", img: "[cite: 12]", dialogues: [{ speaker: "손녀 하은", role: "haeun", text: "할아버지 여 보소! 요즘도 결핵 환자 2명 중 1명이 65세 이상 어르신이래요." }, { speaker: "박말순 할아버지", role: "grandpa", text: "허어, 참말이가?!" }], tip: "65세 이상 어르신은 면역력이 약해져 결핵에 걸리기 쉽습니다." },
      { cut: 9, scene: "보건소 방문. 할아버지가 신분증을 내밀어 접수하고, 간호사 선생님이 환하게 맞이합니다.", img: "[cite: 13]", dialogues: [{ speaker: "보건소 간호사", role: "nurse", text: "어르신 오셨어요! 신분증만 있으시면 65세 이상 결핵 검사는 무료예요." }, { speaker: "박말순 할아버지", role: "grandpa", text: "오메, 돈이 하나도 안 든다고예?" }], tip: "신분증만 챙겨서 가까운 보건소에 방문하세요. (65세 이상 매년 1회 무료)" },
      { cut: 10, scene: "흉부 X선(엑스레이) 촬영실. 가슴을 기계에 대고 숨을 참자 금방 촬영이 끝납니다.", img: "[cite: 14]", dialogues: [{ speaker: "박말순 할아버지", role: "grandpa", text: "이래 찍으모 끝이가? 아픈 것도 없고 참말로 간단하네!" }], tip: "가슴 엑스레이 사진 한 장이면 폐 건강을 바로 확인할 수 있습니다." },
      { cut: 11, scene: "엑스레이 사진에서 의심 소견이 보이자 간호사가 가래검사 통을 친절히 건넵니다.", img: "[cite: 15]", dialogues: [{ speaker: "보건소 간호사", role: "nurse", text: "폐 사진에 흔적이 보여서요, 내일 아침 첫 가래를 이 통에 받아 오세요." }], tip: "X선에서 의심되면 가래검사로 결핵균이 있는지 정확히 확인합니다." },
      { cut: 12, scene: "며칠 후 결과: 결핵 확진. 할아버지가 충격에 말을 잃자 할머니가 옆에서 손을 꼭 잡아줍니다.", img: "[cite: 16]", dialogues: [{ speaker: "할머니", role: "grandma", text: "영감, 너무 겁먹지 마소. 일찍 알았으니 인자 고치모 된다 아이가." }], tip: "결핵 진단을 받아도 놀라지 마세요. 완치할 수 있는 병입니다!" },

      { cut: 13, section: "관리: 꾸준히 약 먹으면 완치! (13~20컷)", scene: "보건소 간호사 선생님이 따뜻한 미소로 할아버지와 할머니를 안심시킵니다.", img: "[cite: 17]", dialogues: [{ speaker: "보건소 간호사", role: "nurse", text: "결핵은 약을 꾸준히 먹으면 깨끗이 낫는 병이에요!" }, { speaker: "보건소 간호사", role: "nurse", text: "치료 시작하고 2주쯤 지나면 남에게 옮길 걱정도 크게 줄어듭니다." }], tip: "결핵약 복용 후 2주가 지나면 전염력이 거의 사라집니다." },
      { cut: 14, scene: "할머니와 손녀 하은이도 함께 보건소에서 가족 접촉자 검진을 받습니다.", img: "[cite: 18]", dialogues: [{ speaker: "보건소 간호사", role: "nurse", text: "같이 사는 가족분들은 지금 기침 증상이 없어도 꼭 함께 검진을 받으세요." }, { speaker: "할머니", role: "grandma", text: "예, 우리도 같이 검사받고 안심하렵니다." }], tip: "환자와 함께 사는 가족도 보건소에서 무료로 검진받을 수 있습니다." },
      { cut: 15, scene: "[낙인 해소] 방 구석에 풀 죽어 앉은 할아버지에게 간호사가 설명하고, 할머니가 따뜻하게 같이 밥을 먹습니다.", img: "[cite: 19]", dialogues: [{ speaker: "보건소 간호사", role: "nurse", text: "어르신! 밥그릇이나 수건, 이불로는 절대 안 옮아요. 기침이나 숨으로 퍼지는 병이에요." }, { speaker: "할머니", role: "grandma", text: "영감 들었제? 기죽지 말고 어여 같이 밥 묵자!" }], tip: "결핵은 부끄러운 병이 아닙니다. 식기나 침구류로는 전염되지 않습니다." },
      { cut: 16, scene: "큼직한 결핵 약봉지와 복약 달력에 '하루도 빠지지 않고 6개월!' 표시가 선명합니다.", img: "[cite: 20]", dialogues: [{ speaker: "보건소 간호사", role: "nurse", text: "하루도 빠지지 않고 6개월 이상 끝까지 드셔야 결핵균이 완전히 사라져요!" }], tip: "결핵 치료의 핵심은 '매일 거르지 않고 최소 6개월간 복용'입니다." },
      { cut: 17, scene: "한 달쯤 뒤 기침이 멈추고 몸이 좀 나아지자 약통을 밀어놓는 할아버지. 할머니가 호통칩니다!", img: "[cite: 21]", dialogues: [{ speaker: "박말순 할아버지", role: "grandpa", text: "인자 기침도 안 나고 다 나은 것 같은데, 약 그만 무도 안 되나?" }, { speaker: "할머니", role: "grandma", text: "영감! 큰일 날 소리 하네! 약 끊으모 안 된다 안 카나!" }], tip: "증상이 좋아졌다고 약을 임의로 끊으면 결핵균이 다시 살아납니다!" },
      { cut: 18, scene: "[핵심 경고 컷] 간호사가 내성 결핵의 위험성과 부작용 대처법을 단호하게 알려줍니다.", img: "[cite: 22]", dialogues: [{ speaker: "보건소 간호사", role: "nurse", text: "약을 마음대로 끊으면 약이 안 듣는 무서운 '내성 결핵'이 될 수 있어요!" }, { speaker: "보건소 간호사", role: "nurse", text: "피부 발진, 눈 노래짐, 속이 너무 불편하면 약을 끊지 말고 먼저 병원이나 보건소에 연락하세요." }], tip: "약 먹고 불편한 증상이 생기면 혼자 끊지 말고 즉시 보건소로 전화하세요!" },
      { cut: 19, scene: "치료비 안내 창구. 국가에서 결핵 치료비를 지원해 주어 할아버지가 안도의 숨을 내쉽니다.", img: "[cite: 23]", dialogues: [{ speaker: "보건소 간호사", role: "nurse", text: "결핵은 국가(산정특례)에서 진료비와 약값 본인부담금을 지원해 드려요. 돈 걱정은 덜으셔도 돼요!" }, { speaker: "박말순 할아버지", role: "grandpa", text: "고맙습니더. 나라에서 약값까지 도와주니 맘 편히 치료받겠심더." }], tip: "결핵 산정특례 지원으로 치료비 부담 없이 치료받을 수 있습니다." },
      { cut: 20, scene: "외출할 땐 마스크를 착용하고, 기침할 땐 옷소매로 입과 코를 가리며, 방 창문을 열어 자주 환기하는 할아버지.", img: "[cite: 24]", dialogues: [{ speaker: "박말순 할아버지", role: "grandpa", text: "기침할 땐 손 말고 옷소매로 입 가리기! 창문도 활짝 열어서 환기하기!" }], tip: "올바른 기침 예절과 실내 환기는 가족과 이웃을 지키는 첫걸음입니다." },

      { cut: 21, section: "에필로그: 건강 되찾은 말순 할아버지 (21~22컷)", scene: "6개월 후 완치! 살이 다시 보기 좋게 오른 할아버지가 마을회관에서 친구들에게 호탕하게 외칩니다.", img: "[cite: 25]", dialogues: [{ speaker: "박말순 할아버지", role: "grandpa", text: "마! 기침 2주 넘으모 감기약만 묵지 말고 보건소 가라! 검사도 무료다!" }, { speaker: "마을회관 친구", role: "friend", text: "형님 얼굴이 훤해졌네! 그라모 나도 오늘 당장 가 볼게예!" }], tip: "기침 2주 ➔ 보건소! 주변 친구분들께도 꼭 알려주세요." },
      { cut: 22, scene: "[최종 요약 카드] 어르신들이 한눈에 기억하는 결핵 예방·관리 4대 수칙", img: "[cite: 26]", isSummary: true, dialogues: [], tip: "다음 이야기: 2탄 「결핵, 미리 막는 법」에서 계속됩니다!" }
    ];

    const mainContainer = document.getElementById('mainContainer');

    function renderAllCuts() {
      mainContainer.innerHTML = '';
      WEBTOON_CUTS.forEach(item => {
        if (item.section) {
          const banner = document.createElement('div');
          banner.className = 'section-banner';
          banner.textContent = item.section;
          mainContainer.appendChild(banner);
        }

        if (item.isSummary) {
          const summaryCard = document.createElement('article');
          summaryCard.className = 'toon-card summary-card';
          summaryCard.id = `cut-${item.cut}`;
          summaryCard.innerHTML = `
            <div class="card-header">
              <span class="cut-badge" style="background:#d97706;">22컷 / 핵심 요약 카드</span>
              <button class="tts-btn" onclick="speakCut(${item.cut})">🔊 소리 듣기</button>
            </div>
            <div class="content-box">
              <h2 style="font-size:calc(20px * var(--font-scale)); color:#b45309; text-align:center;">📌 어르신 결핵 예방 4대 수칙</h2>
              <div class="summary-list">
                <div class="summary-item">✔ 기침 2주 넘으면 ➔ <span style="color:#dc2626;">보건소 · 병원</span></div>
                <div class="summary-item">✔ 65세 이상 어르신 ➔ <span style="color:#1d4ed8;">매년 1회 무료 검진</span></div>
                <div class="summary-item">✔ 결핵약은 <span style="color:#dc2626;">6개월 이상</span>, 끊지 말고 끝까지!</div>
                <div class="summary-item">✔ 같이 사는 <span style="color:#059669;">가족도 함께 무료 검진</span></div>
              </div>
              <div class="key-message" style="text-align:center; margin-top:8px;">📖 ${item.tip}</div>
            </div>
          `;
          mainContainer.appendChild(summaryCard);
          return;
        }

        const dialoguesHtml = item.dialogues.map(d => {
          const roleClass = d.role === 'nurse' ? 'speaker-nurse' : (d.role === 'haeun' ? 'speaker-haeun' : '');
          return `<div class="speech-bubble ${roleClass}"><span class="speaker-name">${d.speaker}</span><div>"${d.text}"</div></div>`;
        }).join('');

        const card = document.createElement('article');
        card.className = 'toon-card';
        card.id = `cut-${item.cut}`;
        card.innerHTML = `
          <div class="card-header">
            <span class="cut-badge">${item.cut}컷 / 22</span>
            <button class="tts-btn" onclick="speakCut(${item.cut})">🔊 소리 듣기</button>
          </div>
          <div class="image-box">
            <img src="${item.img}" alt="${item.cut}컷 웹툰 일러스트">
          </div>
          <div class="content-box">
            <div class="scene-desc">🎬 ${item.scene}</div>
            ${dialoguesHtml}
            <div class="key-message">💡 ${item.tip}</div>
          </div>
        `;
        mainContainer.appendChild(card);
      });
    }

    // 글자 크기 조절
    const FONT_SCALES = [1.0, 1.25, 1.5, 1.8];
    const FONT_LABELS = ["보통", "크게", "더크게", "최대"];
    let currentFontIdx = 1;

    function changeFontSize(delta) {
      currentFontIdx = Math.max(0, Math.min(FONT_SCALES.length - 1, currentFontIdx + delta));
      document.documentElement.style.setProperty('--font-scale', FONT_SCALES[currentFontIdx]);
      document.getElementById('fontBadge').textContent = FONT_LABELS[currentFontIdx];
      updateSafePadding();
    }

    function updateSafePadding() {
      const headerH = document.getElementById('headerBar').offsetHeight;
      const footerH = document.getElementById('footerBar').offsetHeight;
      mainContainer.style.paddingTop = (headerH + 16) + 'px';
      mainContainer.style.paddingBottom = (footerH + 20) + 'px';
    }

    // TTS 음성 읽기
    function speakCut(cutNum) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const item = WEBTOON_CUTS.find(c => c.cut === cutNum);
      if (!item) return;

      let fullText = `${item.cut}컷. ${item.scene}. `;
      if (item.isSummary) {
        fullText += "기침 2주 넘으면 보건소 병원 가기. 65세 이상 매년 1회 무료 검진. 결핵약은 6개월 이상 끝까지 복용. 가족도 함께 검진.";
      } else {
        item.dialogues.forEach(d => { fullText += `${d.speaker}, ${d.text}. `; });
        fullText += item.tip;
      }
      const utter = new SpeechSynthesisUtterance(fullText);
      utter.lang = 'ko-KR';
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    }

    function readCurrentVisibleCut() {
      const cards = document.querySelectorAll('.toon-card');
      const midY = window.innerHeight / 2;
      for (const card of cards) {
        const rect = card.getBoundingClientRect();
        if (rect.top <= midY && rect.bottom >= 100) {
          speakCut(parseInt(card.id.replace('cut-', ''), 10));
          return;
        }
      }
      speakCut(1);
    }

    window.addEventListener('resize', updateSafePadding);
    window.addEventListener('load', updateSafePadding);
    renderAllCuts();
    updateSafePadding();
  </script>
</body>
</html>
