<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>할아버지의 오래된 기침 (1탄) - 결핵 예방 및 관리 웹툰</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-dark: #111827;
      --text-gray: #4b5563;
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --accent: #dc2626;
      --green: #059669;
      --orange: #d97706;
      /* 글자 크기 배율 (기본: 2단계 '크게') */
      --font-scale: 1.25;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nanum Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      line-height: 1.65;
      word-break: keep-all;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ================= 1. 상단 고정 바 ================= */
    .header-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      z-index: 1000;
      border-bottom: 3px solid var(--primary);
    }

    .header-inner {
      max-width: 640px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .title-wrap h1 {
      font-size: calc(16px * var(--font-scale));
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: -0.5px;
    }

    .title-wrap p {
      font-size: calc(12px * var(--font-scale));
      color: var(--accent);
      font-weight: 800;
    }

    /* 글자 크기 조절 버튼 그룹 (어르신 맞춤 큼직한 버튼) */
    .font-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #eff6ff;
      padding: 4px 8px;
      border-radius: 12px;
      border: 2px solid #bfdbfe;
    }

    .font-btn {
      min-width: 48px;
      min-height: 44px;
      background: #ffffff;
      border: 2px solid var(--primary);
      color: var(--primary-dark);
      font-size: 17px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
    }

    .font-btn:active {
      background: var(--primary);
      color: #ffffff;
    }

    .font-badge {
      font-size: 14px;
      font-weight: 800;
      color: var(--primary-dark);
      min-width: 48px;
      text-align: center;
    }

    /* 제작자용 AI 작화 및 저장 툴바 */
    .studio-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 4px;
      border-top: 1px dashed #cbd5e1;
    }

    .studio-btn {
      flex: 1;
      min-height: 38px;
      background: #f8fafc;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      color: #334155;
      cursor: pointer;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .studio-btn.primary {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #92400e;
    }

    .studio-btn.save {
      background: #dcfce7;
      border-color: #10b981;
      color: #065f46;
    }

    /* ================= 2. 본문 컨테이너 ================= */
    .container {
      width: 100%;
      max-width: 640px;
      padding: 130px 12px 130px 12px; /* JS ResizeObserver가 실시간 자동 보정 */
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .section-banner {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: calc(16px * var(--font-scale));
      font-weight: 800;
      text-align: center;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    /* 웹툰 컷 카드 (내부 스크롤 없이 전체 높이 유연 확장) */
    .toon-card {
      background: var(--card-bg);
      border-radius: 18px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      border: 2px solid #cbd5e1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      background: #f8fafc;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cut-badge {
      background: var(--primary);
      color: #ffffff;
      font-size: calc(13px * var(--font-scale));
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      background: #ffffff;
      border: 1.5px solid #94a3b8;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      color: #1e293b;
    }

    .mini-btn.tts {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1d4ed8;
    }

    /* ================= 3. 웹툰 이미지 박스 (4:3 비율 고정) ================= */
    .image-box {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #e2e8f0;
      position: relative;
      overflow: hidden;
      border-bottom: 2px solid #1e293b;
    }

    .image-box img,
    .image-box svg {
      width: 100%;
      height: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.82);
      color: #ffffff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 5px solid #ffffff;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ================= 4. 대사 및 설명 영역 (내부 스크롤 없음) ================= */
    .content-box {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .scene-desc {
      font-size: calc(14px * var(--font-scale));
      color: var(--text-gray);
      font-weight: 700;
      background: #f1f5f9;
      padding: 10px 14px;
      border-radius: 10px;
    }

    .speech-bubble {
      background: #fffbeb;
      border: 2.5px solid #f59e0b;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: calc(16px * var(--font-scale));
      font-weight: 800;
      color: var(--text-dark);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .speaker-name {
      display: inline-block;
      background: #d97706;
      color: #ffffff;
      font-size: calc(13px * var(--font-scale));
      padding: 2px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .speaker-nurse .speaker-name { background: var(--green); }
    .speaker-nurse { background: #ecfdf5; border-color: #10b981; }

    .speaker-haeun .speaker-name { background: var(--primary); }
    .speaker-haeun { background: #eff6ff; border-color: #60a5fa; }

    .key-message {
      background: #fef2f2;
      border-left: 6px solid var(--accent);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: calc(15px * var(--font-scale));
      font-weight: 800;
      color: #991b1b;
    }

    /* 22컷 요약 카드 전용 */
    .summary-card {
      border: 4px solid var(--orange);
      background: #fffbeb;
    }

    .summary-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }

    .summary-item {
      background: #ffffff;
      border: 2px solid #fcd34d;
      padding: 14px;
      border-radius: 12px;
      font-size: calc(16px * var(--font-scale));
      font-weight: 800;
      color: #111827;
    }

    /* ================= 5. 하단 고정 바 ================= */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.12);
      z-index: 1000;
      border-top: 3px solid var(--primary);
    }

    .footer-inner {
      max-width: 640px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-slogan {
      text-align: center;
      font-size: calc(13px * var(--font-scale));
      font-weight: 800;
      color: var(--accent);
    }

    .nav-btns {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      flex: 1;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      font-size: calc(14px * var(--font-scale));
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .nav-btn.prev { background: #e2e8f0; color: #1e293b; }
    .nav-btn.tts-all { background: #dbeafe; color: #1e40af; }
    .nav-btn.call { background: var(--green); color: #ffffff; flex: 1.3; }

    /* AI 설정 모달 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-card h3 {
      font-size: 20px;
      color: var(--primary-dark);
    }

    .modal-card input {
      width: 100%;
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <!-- ================= 상단 고정 메뉴 ================= -->
  <header class="header-bar" id="headerBar">
    <div class="header-inner">
      <div class="header-top-row">
        <div class="title-wrap">
          <h1>할아버지의 오래된 기침 (1탄)</h1>
          <p>기침 2주 넘으면 ➔ 보건소 무료 검진!</p>
        </div>
        <div class="font-controls">
          <button class="font-btn" onclick="changeFontSize(-1)" aria-label="글자 작게">가 -</button>
          <span class="font-badge" id="fontBadge">크게</span>
          <button class="font-btn" onclick="changeFontSize(1)" aria-label="글자 크게">가 +</button>
        </div>
      </div>

      <!-- 제작자 스튜디오 바 (배포용 완성본을 저장할 때는 자동으로 숨겨집니다) -->
      <div class="studio-bar" id="studioBar">
        <button class="studio-btn primary" onclick="openAiModal()">🎨 AI 고화질 웹툰 자동작화</button>
        <button class="studio-btn save" onclick="exportStandaloneHtml()">💾 완성본 HTML 저장</button>
      </div>
    </div>
  </header>

  <!-- ================= 웹툰 본문 (전체 페이지 스크롤) ================= -->
  <main class="container" id="mainContainer"></main>

  <!-- ================= 하단 고정 메뉴 ================= -->
  <footer class="footer-bar" id="footerBar">
    <div class="footer-inner">
      <div class="footer-slogan">📢 "기침 2주 넘으면 감기가 아닐 수 있습니다 → 보건소로 오이소!"</div>
      <div class="nav-btns">
        <button class="nav-btn prev" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆ 맨 위로</button>
        <button class="nav-btn tts-all" onclick="readCurrentVisibleCut()">🔊 읽어주기</button>
        <a class="nav-btn call" href="https://m.search.naver.com/search.naver?query=가까운+보건소" target="_blank">🏥 보건소 찾기</a>
      </div>
    </div>
  </footer>

  <!-- ================= AI 웹툰 작화 모달 ================= -->
  <div class="modal-backdrop" id="aiModal">
    <div class="modal-card">
      <h3>🎨 네이버 웹툰 스타일 AI 작화 스튜디오</h3>
      <p style="font-size:14px; color:#475569;">
        Google Gemini API 키를 입력하면 1컷~22컷 전체를 <strong>실제 한국 웹툰 작가 스타일(컬러 셀 채색 만화)</strong>로 자동 생성하여 채워 넣습니다.<br>
        ※ API 키 없이도 각 컷의 <strong>[📁 그림 넣기]</strong> 버튼으로 직접 만화 이미지를 넣으실 수 있습니다.
      </p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy... (Gemini API Key 입력)">
      <div style="display:flex; gap:8px;">
        <button class="nav-btn call" onclick="startBatchAiDraw()">🚀 22컷 전체 웹툰 그리기</button>
        <button class="nav-btn prev" onclick="closeAiModal()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 숨겨진 파일 업로더 (컷별 이미지 직접 교체용) -->
  <input type="file" id="fileInput" accept="image/*" style="display:none">

  <script>
    // =========================================================================
    // 1. 시나리오 22컷 전체 데이터 (경상도 사투리 & 어르신 맞춤 원칙 100% 반영)
    // =========================================================================
    const WEBTOON_CUTS = [
      // --- 프롤로그: 증상 (1~6컷) ---
      {
        cut: 1, section: "프롤로그: 수상한 기침 (1~6컷)",
        scene: "마을회관. 박말순 할아버지(75세)가 장기판 앞에서 마른기침을 콜록콜록 합니다.",
        sfx: "콜록! 콜록!", mood: "cough", bg: "#fef3c7",
        dialogues: [
          { speaker: "마을회관 친구", role: "friend", text: "말순이 형님, 기침이 와 그리 오래가노?" },
          { speaker: "박말순 할아버지", role: "grandpa", text: "환절기 감기 아이가. 약국 약 먹으모 낫는다." }
        ],
        tip: "기침이 2주 넘게 계속되면 단순 감기가 아닐 수 있습니다."
      },
      {
        cut: 2,
        scene: "약국 감기약을 털어 먹는 할아버지. 벽걸이 달력에 '기침 시작' 표시가 벌써 3주째입니다.",
        sfx: "벌써 3주째...", mood: "calendar", bg: "#fee2e2",
        dialogues: [
          { speaker: "박말순 할아버지", role: "grandpa", text: "이상하네... 약을 이래 무도 기침이 안 떨어지노." }
        ],
        tip: "핵심 기억! 기침이 2주 이상 이어지면 꼭 보건소로 가세요."
      },
      {
        cut: 3,
        scene: "깊은 밤. 잠자리에서 식은땀으로 이불이 흠뻑 젖어 있고, 할머니가 걱정스레 바라봅니다.",
        sfx: "식은땀 줄줄", mood: "night", bg: "#dbeafe",
        dialogues: [
          { speaker: "할머니", role: "grandma", text: "영감, 자면서 식은땀을 와 이래 많이 흘리노... 이불이 다 젖었네." }
        ],
        tip: "밤에 자면서 식은땀이 많이 나는 것도 결핵의 주요 증상입니다."
      },
      {
        cut: 4,
        scene: "아침 밥상. 입맛이 없어 숟가락을 힘없이 내려놓는 할아버지.",
        sfx: "입맛 없음", mood: "table", bg: "#ffedd5",
        dialogues: [
          { speaker: "할머니", role: "grandma", text: "영감, 요새 와 이래 밥을 못 묵노? 바지도 헐렁하네." },
          { speaker: "박말순 할아버지", role: "grandpa", text: "나이 들모 다 그렇지 뭐..." }
        ],
        tip: "나이 탓이라고 넘기지 마세요! 체중 감소와 피로감은 몸이 보내는 신호입니다."
      },
      {
        cut: 5,
        scene: "[중요 정보 컷] 할아버지 몸에 나타난 결핵 의심 증상 5가지!",
        sfx: "결핵 5대 증상!", mood: "info5", bg: "#fef2f2",
        dialogues: [
          { speaker: "꼭 확인하세요!", role: "nurse", text: "① 2주 넘는 기침  ② 가래  ③ 미열  ④ 밤에 식은땀  ⑤ 몸무게 줄고 기운 없음" }
        ],
        tip: "기침 2주 ➔ 지체 없이 보건소!"
      },
      {
        cut: 6,
        scene: "주말에 놀러 온 대학생 손녀 하은이가 기침하며 야위어 가는 할아버지를 유심히 보며 표정이 굳습니다.",
        sfx: "유심...", mood: "serious", bg: "#f3e8ff",
        dialogues: [
          { speaker: "손녀 하은", role: "haeun", text: "(할아버지 기침 소리가 예사롭지 않은데... 살도 너무 빠지셨어!)" }
        ],
        tip: "가족들이 어르신의 기침 기간을 함께 살펴봐 주세요."
      },

      // --- 대처 (7~12컷) ---
      {
        cut: 7, section: "대처: 보건소 무료 검진 (7~12컷)",
        scene: "손녀 하은이가 할아버지의 거친 두 손을 꼭 잡으며 진지하게 말씀드립니다.",
        sfx: "기침 2주 → 보건소!", mood: "holdhands", bg: "#eff6ff",
        dialogues: [
          { speaker: "손녀 하은", role: "haeun", text: "할아버지, 기침 2주 넘으면 보건소 가야 돼요. 감기가 아닐 수도 있어요!" },
          { speaker: "박말순 할아버지", role: "grandpa", text: "내가 와 결핵이고, 그거 못 먹던 옛날 병 아이가…" }
        ],
        tip: "결핵은 옛날 병이 아닙니다. 지금도 우리 주변에 흔히 있습니다."
      },
      {
        cut: 8,
        scene: "[인식 개선] 하은이가 스마트폰의 큼직한 뉴스 통계를 할아버지께 보여드립니다.",
        sfx: "2명 중 1명이 어르신!", mood: "phone", bg: "#e0f2fe",

            <path d="M 200 142 L 194 170 L 208 172" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>
            <path d="M 175 175 L 165 196 M 225 175 L 235 196" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
            <path d="${mouthPath}" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
            ${sweatDrops}
          </g>

          <!-- 우측 등장인물 -->
          ${partnerSvg}

          <!-- 만화 효과음 배지 (SFX) -->
          <g transform="translate(24, 365)">
            <rect x="0" y="0" width="592" height="90" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
            <rect x="14" y="14" width="175" height="62" rx="12" fill="#dc2626"/>
            <text x="101" y="53" font-size="23" font-weight="900" fill="#ffffff" text-anchor="middle">${sfx}</text>
            <text x="210" y="43" font-size="20" font-weight="800" fill="#111827">${item.cut}컷 핵심 메시지</text>
            <text x="210" y="70" font-size="18" font-weight="700" fill="#1d4ed8">"기침 2주 넘으면 보건소 무료 검진!"</text>
          </g>
        </svg>
      `;
    }

    // =========================================================================
    // 3. 웹툰 22컷 DOM 렌더링 및 로컬스토리지 이미지 복원
    // =========================================================================
    const mainContainer = document.getElementById('mainContainer');
    let currentUploadCut = null;

    function renderAllCuts() {
      mainContainer.innerHTML = '';

      WEBTOON_CUTS.forEach(item => {
        // 섹션 배너 출력
        if (item.section) {
          const banner = document.createElement('div');
          banner.className = 'section-banner';
          banner.textContent = item.section;
          mainContainer.appendChild(banner);
        }

        // 22컷 요약 카드는 별도 레이아웃
        if (item.isSummary) {
          const summaryCard = document.createElement('article');
          summaryCard.className = 'toon-card summary-card';
          summaryCard.id = `cut-${item.cut}`;
          summaryCard.innerHTML = `
            <div class="card-header">
              <span class="cut-badge" style="background:#d97706;">22컷 / 핵심 요약 카드</span>
              <div class="card-actions">
                <button class="mini-btn tts" onclick="speakCut(${item.cut})">🔊 소리 듣기</button>
              </div>
            </div>
            <div class="content-box">
              <h2 style="font-size:calc(20px * var(--font-scale)); color:#b45309; text-align:center;">
                📌 어르신 결핵 예방 4대 수칙
              </h2>
              <div class="summary-list">
                <div class="summary-item">✔ 기침 2주 넘으면 ➔ <span style="color:#dc2626;">보건소 · 병원</span></div>
                <div class="summary-item">✔ 65세 이상 어르신 ➔ <span style="color:#1d4ed8;">매년 1회 무료 검진</span></div>
                <div class="summary-item">✔ 결핵약은 <span style="color:#dc2626;">6개월 이상</span>, 끊지 말고 끝까지!</div>
                <div class="summary-item">✔ 같이 사는 <span style="color:#059669;">가족도 함께 무료 검진</span></div>
              </div>
              <div class="key-message" style="text-align:center; margin-top:8px;">
                📖 ${item.tip}
              </div>
            </div>
          `;
          mainContainer.appendChild(summaryCard);
          return;
        }

        // 일반 웹툰 컷 (1~21컷)
        const savedImg = localStorage.getItem(`tb_toon_cut_${item.cut}`);
        const mediaHtml = savedImg
          ? `<img id="img-cut-${item.cut}" src="${savedImg}" alt="${item.cut}컷 웹툰 이미지">`
          : `<div id="svg-cut-${item.cut}" style="width:100%;height:100%;">${createWebtoonSvg(item)}</div>`;

        const dialoguesHtml = item.dialogues.map(d => {
          const roleClass = d.role === 'nurse' ? 'speaker-nurse' : (d.role === 'haeun' ? 'speaker-haeun' : '');
          return `
            <div class="speech-bubble ${roleClass}">
              <span class="speaker-name">${d.speaker}</span>
              <div>"${d.text}"</div>
            </div>
          `;
        }).join('');

        const card = document.createElement('article');
        card.className = 'toon-card';
        card.id = `cut-${item.cut}`;
        card.innerHTML = `
          <div class="card-header">
            <span class="cut-badge">${item.cut}컷 / 22</span>
            <div class="card-actions">
              <button class="mini-btn tts" onclick="speakCut(${item.cut})">🔊 소리 듣기</button>
              <button class="mini-btn studio-only" onclick="triggerFileUpload(${item.cut})">📁 그림 넣기</button>
              <button class="mini-btn studio-only" onclick="generateSingleAiCut(${item.cut})">✨ AI작화</button>
            </div>
          </div>
          <div class="image-box" id="box-cut-${item.cut}">
            ${mediaHtml}
            <div class="loading-overlay" id="loader-cut-${item.cut}">
              <div class="spinner"></div>
              <div>네이버 웹툰 스타일로<br>${item.cut}컷 만화를 그리는 중...</div>
            </div>
          </div>
          <div class="content-box">
            <div class="scene-desc">🎬 ${item.scene}</div>
            ${dialoguesHtml}
            <div class="key-message">💡 ${item.tip}</div>
          </div>
        `;
        mainContainer.appendChild(card);
      });
    }

    // =========================================================================
    // 4. 어르신 맞춤 글자 크기 4단계 조절 & 상하단 고정바 가림 방지(ResizeObserver)
    // =========================================================================
    const FONT_SCALES = [1.0, 1.25, 1.5, 1.8];
    const FONT_LABELS = ["보통", "크게", "더크게", "최대"];
    let currentFontIdx = 1; // 기본값: 크게(1.25)

    function changeFontSize(delta) {
      currentFontIdx = Math.max(0, Math.min(FONT_SCALES.length - 1, currentFontIdx + delta));
      document.documentElement.style.setProperty('--font-scale', FONT_SCALES[currentFontIdx]);
      document.getElementById('fontBadge').textContent = FONT_LABELS[currentFontIdx];
      updateSafePadding();
    }

    function updateSafePadding() {
      const headerH = document.getElementById('headerBar').offsetHeight;
      const footerH = document.getElementById('footerBar').offsetHeight;
      mainContainer.style.paddingTop = (headerH + 18) + 'px';
      mainContainer.style.paddingBottom = (footerH + 24) + 'px';
    }

    const barObserver = new ResizeObserver(updateSafePadding);
    barObserver.observe(document.getElementById('headerBar'));
    barObserver.observe(document.getElementById('footerBar'));
    window.addEventListener('resize', updateSafePadding);

    // =========================================================================
    // 5. 한국어 음성 읽어주기 (TTS - 눈이 침침한 어르신 배려)
    // =========================================================================
    function speakCut(cutNum) {
      if (!('speechSynthesis' in window)) {
        alert('이 브라우저에서는 음성 읽기 기능을 지원하지 않습니다.');
        return;
      }
      window.speechSynthesis.cancel();
      const item = WEBTOON_CUTS.find(c => c.cut === cutNum);
      if (!item) return;

      let fullText = `${item.cut}컷. ${item.scene}. `;
      if (item.isSummary) {
        fullText += "기침 2주 넘으면 보건소 병원 가기. 65세 이상 매년 1회 무료 검진. 결핵약은 6개월 이상 끝까지 복용. 가족도 함께 검진.";
      } else {
        item.dialogues.forEach(d => {
          fullText += `${d.speaker}, ${d.text}. `;
        });
        fullText += item.tip;
      }

      const utter = new SpeechSynthesisUtterance(fullText);
      utter.lang = 'ko-KR';
      utter.rate = 0.9; // 어르신들이 듣기 편하게 약간 천천히
      window.speechSynthesis.speak(utter);
    }

    function readCurrentVisibleCut() {
      const cards = document.querySelectorAll('.toon-card');
      const midY = window.innerHeight / 2;
      for (const card of cards) {
        const rect = card.getBoundingClientRect();
        if (rect.top <= midY && rect.bottom >= 100) {
          const cutNum = parseInt(card.id.replace('cut-', ''), 10);
          speakCut(cutNum);
          return;
        }
      }
      speakCut(1);
    }

    // =========================================================================
    // 6. 직접 그림 넣기 & Gemini AI 고화질 네이버 웹툰 작화 스튜디오
    // =========================================================================
    const fileInput = document.getElementById('fileInput');
    function triggerFileUpload(cutNum) {
      currentUploadCut = cutNum;
      fileInput.value = '';
      fileInput.click();
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !currentUploadCut) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        applyCutImage(currentUploadCut, ev.target.result);
      };
      reader.readAsDataURL(file);
    });

    function applyCutImage(cutNum, dataUrl) {
      try {
        localStorage.setItem(`tb_toon_cut_${cutNum}`, dataUrl);
      } catch (e) {
        console.warn('브라우저 저장 용량 초과로 현재 화면에만 유지됩니다.');
      }
      const box = document.getElementById(`box-cut-${cutNum}`);
      const loader = document.getElementById(`loader-cut-${cutNum}`);
      box.innerHTML = `<img id="img-cut-${cutNum}" src="${dataUrl}" alt="${cutNum}컷 웹툰 이미지">`;
      if (loader) box.appendChild(loader);
    }

    function openAiModal() {
      const savedKey = localStorage.getItem('gemini_api_key') || '';
      document.getElementById('apiKeyInput').value = savedKey;
      document.getElementById('aiModal').style.display = 'flex';
    }

    function closeAiModal() {
      document.getElementById('aiModal').style.display = 'none';
    }

    async function generateSingleAiCut(cutNum) {
      let apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        openAiModal();
        return;
      }
      const item = WEBTOON_CUTS.find(c => c.cut === cutNum);
      if (!item || item.isSummary) return;

      const loader = document.getElementById(`loader-cut-${cutNum}`);
      if (loader) loader.style.display = 'flex';

      const prompt = `Korean Naver webtoon style high-quality digital manhwa illustration, clean bold ink line art, warm cell shading, expressive Korean characters, 4:3 aspect ratio, no text in speech bubbles. Scene: ${item.scene}. Main character: 75-year-old Korean rural grandfather with gray hair and warm brown vest.`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            instances: [{ prompt }],
            parameters: { sampleCount: 1, aspectRatio: "4:3" }
          })
        });
        const data = await res.json();
        const b64 = data?.predictions?.[0]?.bytesBase64Encoded;
        if (b64) {
          applyCutImage(cutNum, `data:image/png;base64,${b64}`);
        } else {
          alert(`AI 이미지 생성 실패: API 키 권한을 확인하거나 [📁 그림 넣기]를 이용해 주세요.`);
        }
      } catch (err) {
        alert('네트워크 오류가 발생했습니다: ' + err.message);
      } finally {
        if (loader) loader.style.display = 'none';
      }
    }

    async function startBatchAiDraw() {
      const keyVal = document.getElementById('apiKeyInput').value.trim();
      if (!keyVal) {
        alert('Gemini API 키를 입력해 주세요.');
        return;
      }
      localStorage.setItem('gemini_api_key', keyVal);
      closeAiModal();

      for (let i = 1; i <= 21; i++) {
        await generateSingleAiCut(i);
      }
      alert('🎉 21컷 전체 고화질 웹툰 작화가 완료되었습니다! [💾 완성본 HTML 저장]을 눌러 배포용 파일을 만드세요.');
    }

    // =========================================================================
    // 7. 카카오톡 배포용 단일 HTML 파일 내보내기 (그림 데이터 완전 내장)
    // =========================================================================
    function exportStandaloneHtml() {
      const clone = document.documentElement.cloneNode(true);
      // 제작자 전용 버튼 숨기기
      const studioBar = clone.querySelector('#studioBar');
      if (studioBar) studioBar.remove();
      clone.querySelectorAll('.studio-only').forEach(el => el.remove());

      const htmlContent = '<!DOCTYPE html>\n' + clone.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '결핵예방웹툰_1탄_할아버지의오래된기침_완성본.html';
      a.click();
      URL.revokeObjectURL(url);
    }

    // 초기 실행
    renderAllCuts();
    updateSafePadding();
  </script>
</body>
</html>
